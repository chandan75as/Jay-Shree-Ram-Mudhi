<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management - Jay Shree Ram Mudhi</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- Apna Firebase Config File -->
    <script src="my.js"></script>

    <style>
        :root {
            --bg-maroon: #5E1914;
            --gold: #D4AF37;
            --white: #FDF7E3;
            --danger: #ff4d4d;
            --success: #28a745;
            --edit: #4da6ff;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-maroon); color: var(--white); height: 100vh; display: flex; flex-direction: column; font-size: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 3px solid var(--gold); background: rgba(0,0,0,0.2); }
        .header-title { color: var(--gold); font-size: 2rem; font-weight: bold; text-transform: uppercase; margin: 0; text-align: center; flex: 1;}
        
        .back-btn { background: transparent; color: var(--gold); border: 2px solid var(--gold); padding: 8px 15px; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; text-decoration: none; transition: 0.2s; }
        .back-btn:hover { background: var(--gold); color: var(--bg-maroon); }

        .main-container { display: flex; flex-direction: column; align-items: center; padding: 30px; flex: 1; overflow-y: auto; }
        .price-card { background: rgba(0,0,0,0.3); border: 2px solid var(--gold); border-radius: 12px; width: 100%; max-width: 650px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .add-form { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; }
        input, select { flex: 1; padding: 10px 12px; border: 2px solid var(--gold); background: #333; color: white; border-radius: 6px; font-size: 1.1rem; outline: none; transition: 0.2s;}
        input:focus, select:focus { border-color: #fff; }
        input[type="password"] { text-transform: none; text-align: center; font-size: 1.5rem; letter-spacing: 5px; }
        .btn-add { background: var(--gold); color: var(--bg-maroon); border: none; border-radius: 6px; padding: 10px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .btn-add:hover { transform: scale(1.02); filter: brightness(1.1); }
        
        .list-header { font-size: 1.3rem; color: var(--gold); border-bottom: 1px dashed var(--gold); padding-bottom: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        
        .price-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid transparent; transition: 0.2s; }
        .price-item:hover { background: rgba(212,175,55,0.1); border-color: var(--gold); }
        
        .prod-name { font-size: 1.2rem; font-weight: bold; text-transform: capitalize;}
        .prod-rate { font-size: 1.2rem; color: #4da6ff; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .actions { display: flex; gap: 10px; }
        .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; padding: 5px; transition: 0.2s;}
        .btn-icon:hover { transform: scale(1.2); }
        .btn-icon.edit { color: var(--edit); }
        .btn-icon.del { color: var(--danger); }
        .btn-icon.hist { color: var(--success); }

        #dbStatus { font-size: 1rem; color: #ff9800; text-align: center; margin-top: 5px; font-weight: bold; }
        
        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-maroon); border: 3px solid var(--gold); padding: 25px; border-radius: 12px; width: 380px; position: relative; max-height: 80vh; display: flex; flex-direction: column;}
        .close-btn { position: absolute; top: 5px; right: 15px; font-size: 30px; color: var(--gold); cursor: pointer; font-weight: bold; transition: 0.2s; z-index: 10;}
        .close-btn:hover { color: var(--danger); transform: scale(1.1); }
        .btn-save { width: 100%; padding: 12px; background: var(--gold); border: none; cursor: pointer; font-weight: bold; color: var(--bg-maroon); margin-top: 15px; font-size: 1.1rem; border-radius: 6px; transition: 0.2s;}
        .btn-save:hover { filter: brightness(1.1); }

        /* History Styling */
        .history-list { overflow-y: auto; padding-right: 5px; margin-top: 15px; flex: 1;}
        .history-row { background: rgba(0,0,0,0.3); border: 1px solid var(--gold); padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 0.95rem; line-height: 1.4;}
        .history-time { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; border-bottom: 1px solid #444; padding-bottom: 3px;}
        .history-log { color: var(--white); font-weight: bold;}
        .history-log.added { color: var(--success); }
        .history-log.deduct { color: var(--danger); }
        .history-log.edit { color: var(--edit); }

        #toastBox { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .toast { background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: fadein 0.3s, fadeout 0.3s 2.7s forwards; border-left: 5px solid var(--gold); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h1 class="header-title">📦 Stock Management</h1>
        <div style="width: 130px;"></div>
    </header>

    <div id="dbStatus">Connecting to Cloud... ⏳</div>
    <div id="toastBox"></div>

    <div class="main-container">
        <div class="price-card">
            
            <div class="add-form">
                <!-- DROPDOWN FROM PRICE LIST -->
                <select id="newStockName">
                    <option value="" disabled selected>-- Select Product --</option>
                </select>
                <input type="number" id="newStockQty" placeholder="Add Qty" style="max-width: 120px;">
                <button class="btn-add" onclick="addStock()">+ Add</button>
            </div>

            <div class="list-header">📦 Current Stock List</div>
            
            <div id="stockList">
                <!-- Stock load hoga yahan -->
            </div>

        </div>
    </div>

    <!-- Password Modal -->
    <div id="passModal" class="modal">
        <div class="modal-content" style="width: 320px;">
            <span class="close-btn" onclick="closePassModal()">&times;</span>
            <h3 style="color:var(--danger); text-align:center; margin-top:0;">🔒 Security Check</h3>
            <p style="text-align:center; color:#ccc; margin-top:0;">Edit/Delete karne ke liye password daalein</p>
            <input type="password" id="adminPass" placeholder="* * *">
            <button class="btn-save" onclick="verifyPassword()" style="background:var(--danger); color:white;">Unlock</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
            <h3 style="color:var(--gold); text-align:center; margin-top:0; margin-bottom: 15px;">✏️ Edit Stock Qty</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editStockName" readonly style="color:var(--gold); background:rgba(0,0,0,0.4); font-weight:bold;">
            <input type="number" id="editStockQty" placeholder="New Exact Qty">
            <button class="btn-save" onclick="saveEditedStock()">Update Stock</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content" style="width: 450px;">
            <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
            <h3 style="color:var(--gold); text-align:center; margin-top:0; border-bottom:1px dashed var(--gold); padding-bottom:10px;" id="histTitle">📜 Stock History</h3>
            <div class="history-list" id="historyContent">
                <!-- History Items -->
            </div>
        </div>
    </div>

    <script>
        // Utilities
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
        function showToast(msg, type = 'info') {
            let toastBox = document.getElementById('toastBox');
            let toast = document.createElement('div');
            toast.classList.add('toast', type);
            let icon = type === 'success' ? '✅' : (type === 'error' ? '⚠️' : 'ℹ️');
            toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
            toastBox.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
        
        function getTimeString() {
            return new Date().toLocaleString('en-IN', { hour12: true, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        }

        // Data Normalization (Safely initializing history array)
        function normalizeData(data) {
            if(!data) return { places: [], customers: [], defaultPrices: [], expenses: [], staff: [], stocks: [] };
            
            let safeStocks = (data.stocks || []).filter(s => s != null);
            safeStocks.forEach(s => { 
                if(!s.id) s.id = generateId(); 
                if(!s.history) s.history = []; // History array zaroori hai
            });

            return {
                places: (data.places || []).filter(p => p != null),
                customers: (data.customers || []).filter(c => c != null),
                defaultPrices: (data.defaultPrices || []).filter(p => p != null),
                expenses: (data.expenses || []).filter(e => e != null),
                staff: (data.staff || []).filter(s => s != null),
                stocks: safeStocks
            };
        }

        let state = { places: [], customers: [], defaultPrices: [], expenses: [], staff: [], stocks: [] };

        // Firebase Sync
        dbRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                state = normalizeData(snapshot.val());
                document.getElementById('dbStatus').innerHTML = "Live 🟢";
                document.getElementById('dbStatus').style.color = "#4CAF50";
                
                populateProductDropdown(); // <--- Dropdown yahan se load hoga
                renderStock(); 
            }
        });

        function saveToCloud() { 
            dbRef.set(state).then(() => {
                document.getElementById('dbStatus').innerHTML = "Live 🟢";
                document.getElementById('dbStatus').style.color = "#4CAF50";
            }).catch(() => { showToast("Save failed!", "error"); });
        }

        // ==========================================
        // FETCH PRODUCTS FROM PRICE.HTML
        // ==========================================
        function populateProductDropdown() {
            let select = document.getElementById('newStockName');
            let optionsHTML = '<option value="" disabled selected>-- Select Product --</option>';
            
            if (state.defaultPrices && state.defaultPrices.length > 0) {
                state.defaultPrices.forEach(p => {
                    optionsHTML += `<option value="${p.prodName}">${p.prodName}</option>`;
                });
            } else {
                optionsHTML = '<option value="" disabled selected>Pehle Price List banayein!</option>';
            }
            
            select.innerHTML = optionsHTML;
        }

        // ==========================================
        // PASSWORD PROTECTION LOGIC
        // ==========================================
        let pendingAction = null;
        let pendingTargetId = null;

        function requestAction(action, id) {
            pendingAction = action;
            pendingTargetId = id;
            document.getElementById('adminPass').value = '';
            document.getElementById('passModal').style.display = 'flex';
            setTimeout(() => document.getElementById('adminPass').focus(), 100);
        }

        function closePassModal() { document.getElementById('passModal').style.display = 'none'; }

        function verifyPassword() {
            let pass = document.getElementById('adminPass').value;
            if (pass === '258') {
                closePassModal();
                if (pendingAction === 'edit') { openEditModal(pendingTargetId); } 
                else if (pendingAction === 'delete') { executeDelete(pendingTargetId); }
            } else {
                showToast("Galat Password! Access Denied.", "error");
            }
        }

        // ==========================================
        // ADD / EDIT / DELETE STOCK
        // ==========================================
        function addStock() {
            let name = document.getElementById('newStockName').value;
            let qty = parseFloat(document.getElementById('newStockQty').value);
            
            if(!name || isNaN(qty)) {
                showToast("Product select karein aur quantity daalein!", "error"); return;
            }

            if(!state.stocks) state.stocks = [];
            let existing = state.stocks.find(s => s.name.toLowerCase() === name.toLowerCase());
            let timeNow = getTimeString();
            
            if(existing) {
                let oldQty = existing.qty;
                existing.qty += qty; 
                existing.history.push({
                    id: generateId(), 
                    time: timeNow, 
                    log: `Added +${qty} qty (Old: ${oldQty} ➡️ New: ${existing.qty})`,
                    type: 'added'
                });
                showToast("Existing Stock me add ho gaya!", "success");
            } else {
                state.stocks.push({ 
                    id: generateId(), 
                    name: name, 
                    qty: qty,
                    history: [{ id: generateId(), time: timeNow, log: `Initial Stock Added: ${qty}`, type: 'added' }]
                });
                showToast("Naya Stock Add Ho Gaya!", "success");
            }

            document.getElementById('newStockName').value = "";
            document.getElementById('newStockQty').value = "";
            saveToCloud();
        }

        function executeDelete(id) {
            if(confirm("Kya aap sach mein is stock item ko hatana chahte hain?")) {
                state.stocks = state.stocks.filter(p => p.id !== id);
                showToast("Stock Delete Ho Gaya!", "success");
                saveToCloud();
            }
        }

        function openEditModal(id) {
            let s = state.stocks.find(x => x.id === id);
            if(s) {
                document.getElementById('editId').value = id;
                document.getElementById('editStockName').value = s.name;
                document.getElementById('editStockQty').value = s.qty;
                document.getElementById('editModal').style.display = 'flex';
                setTimeout(() => document.getElementById('editStockQty').focus(), 100);
            }
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        function saveEditedStock() {
            let id = document.getElementById('editId').value;
            let qty = parseFloat(document.getElementById('editStockQty').value);

            if(isNaN(qty)) { showToast("Sahi quantity daalein!", "error"); return; }

            let sIndex = state.stocks.findIndex(x => x.id === id);
            if(sIndex > -1) {
                let oldQty = state.stocks[sIndex].qty;
                state.stocks[sIndex].qty = qty;
                
                // History me record save karo
                let timeNow = getTimeString();
                state.stocks[sIndex].history.push({
                    id: generateId(),
                    time: timeNow,
                    log: `Admin Edited Qty (Old: ${oldQty} ➡️ New: ${qty})`,
                    type: 'edit'
                });

                showToast("Stock Update Ho Gaya!", "success");
                closeEditModal();
                saveToCloud();
            }
        }

        // ==========================================
        // HISTORY VIEWER
        // ==========================================
        function openHistoryModal(id) {
            let s = state.stocks.find(x => x.id === id);
            if(!s) return;
            
            document.getElementById('histTitle').innerHTML = `📜 History: <span style="text-transform:capitalize;">${s.name}</span>`;
            let histContent = document.getElementById('historyContent');
            
            let hList = s.history || [];
            if(hList.length === 0) {
                histContent.innerHTML = '<div style="text-align:center; padding:30px; color:#aaa;">Koi history available nahi hai.</div>';
            } else {
                histContent.innerHTML = [...hList].reverse().map(h => {
                    return `
                    <div class="history-row">
                        <div class="history-time">⏱️ ${h.time}</div>
                        <div class="history-log ${h.type || 'edit'}">${h.log}</div>
                    </div>`;
                }).join('');
            }
            document.getElementById('historyModal').style.display = 'flex';
        }
        function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }

        // ==========================================
        // RENDER UI
        // ==========================================
        function renderStock() {
            let listDiv = document.getElementById('stockList');
            let sList = state.stocks || [];

            if (sList.length === 0) {
                listDiv.innerHTML = '<div style="text-align:center; color:#aaa; font-style:italic; padding: 20px;">Abhi koi stock add nahi kiya gaya hai.</div>';
                return;
            }

            listDiv.innerHTML = sList.slice().reverse().map((s) => {
                let qtyColor = s.qty <= 0 ? 'var(--danger)' : '#4da6ff';
                return `
                <div class="price-item">
                    <div class="prod-name">${s.name}</div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div class="prod-rate" style="color:${qtyColor}">Qty: ${s.qty}</div>
                        <div class="actions">
                            <button class="btn-icon hist" onclick="openHistoryModal('${s.id}')" title="View History">📜</button>
                            <button class="btn-icon edit" onclick="requestAction('edit', '${s.id}')" title="Edit Qty">✏️</button>
                            <button class="btn-icon del" onclick="requestAction('delete', '${s.id}')" title="Delete Stock">🗑️</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // ==========================================
        // KEYBOARD SHORTCUTS
        // ==========================================
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('passModal').style.display === 'flex') { verifyPassword(); }
                else if (document.getElementById('editModal').style.display === 'flex') { saveEditedStock(); } 
                else if (document.getElementById('historyModal').style.display === 'none') {
                    let act = document.activeElement;
                    if(act.id === 'newStockName' || act.id === 'newStockQty') addStock();
                }
            } else if (e.key === 'Escape') { 
                closeEditModal(); closePassModal(); closeHistoryModal();
            }
        });

    </script>
</body>
</html>
